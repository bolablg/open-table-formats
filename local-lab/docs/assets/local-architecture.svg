<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc"><title id="title">Local table formats lab</title><desc id="desc">One unchanged local source file, olist_orders_dataset.csv, is mounted read-only into Docker. JupyterLab and Apache Spark 3.5.7 read its eight business columns and write new Parquet files plus table metadata into three separate prefixes in LocalStack S3-compatible object storage. Iceberg uses iceberg/lab/orders with data and JSON/Avro metadata. Delta uses delta/orders with Parquet and a _delta_log transaction log. Hudi Copy-on-Write uses hudi/orders with Parquet, a completed .hoodie timeline and auxiliary metadata table. The CSV is outside the S3 table prefixes and is not converted in place. Spark captures operation evidence into saved JSON. The local browser explorer reads that saved evidence, not live tables. CSV and Parquet are file formats; Iceberg, Delta and Hudi are table formats. Solid arrows mark table writes; dashed arrows mark reads or saved evidence capture, with direction and labels distinguishing them.</desc>
<defs>
<marker id="write" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#111"/></marker>
<marker id="read" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#111"/></marker>
</defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:39px;font-weight:700;letter-spacing:-1px}.sub{font-size:22px;fill:#555}.heading{font-size:25px;font-weight:700}.body{font-size:19px}.small{font-size:17px;fill:#555}.label{font-family:Menlo,Consolas,monospace;font-size:16px;font-weight:700}.mono{font-family:Menlo,Consolas,monospace;font-size:17px}</style>
<rect x="0" y="0" width="1440" height="800" rx="0" fill="#fff" stroke="#fff" stroke-width="1"/>
