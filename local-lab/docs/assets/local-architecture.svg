<text x="776" y="290" class="small">Write</text>
<rect x="845" y="204" width="530" height="329" rx="0" fill="#fff" stroke="#111" stroke-width="1"/>
<text x="865" y="240" class="heading">LocalStack / S3 API</text>
<text x="865" y="269" class="small">Separate object prefixes; original CSV is outside them</text>
